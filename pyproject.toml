[project]
name = "qfacs"
version = "0.1.0"
description = "Automated qFACS: Quantibrite PE calibration to antigens per cell"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qfacs = "qfacs.__main__:main"

[tool.setuptools]
packages = ["qfacs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
